apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbitiq-ingress
  namespace: orbitiq
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.orbitiq.dev
        - api.orbitiq.dev
      secretName: orbitiq-tls
  rules:
    - host: app.orbitiq.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.orbitiq.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
